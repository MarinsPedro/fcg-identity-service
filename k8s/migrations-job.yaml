apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrations
  namespace: fcg
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: identity-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: postgres:17
        command:
        - sh
        - -c
        - until pg_isready -h postgres -p 5432 -U fcg_identity_app -d fcg_identity; do echo waiting for identity database;
          sleep 3; done
      containers:
      - name: migrations
        image: fcg-identity-migrations:local
        imagePullPolicy: IfNotPresent
        env:
        - name: IDENTITY_MIGRATIONS_CONNECTION
          valueFrom:
            secretKeyRef:
              name: fcg-dev-secrets
              key: identity-connection-string
        - name: Admin__Password
          valueFrom:
            secretKeyRef:
              name: fcg-dev-secrets
              key: identity-admin-password
        - name: InitialServiceClient__Secret
          valueFrom:
            secretKeyRef:
              name: fcg-dev-secrets
              key: web-bff-secret
        envFrom:
        - configMapRef:
            name: fcg-identity-migrations-config
