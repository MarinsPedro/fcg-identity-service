apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrations
  namespace: fcg
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: identity-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U fcg_identity_app -d fcg_identity; do echo waiting for identity database; sleep 3; done
      containers:
        - name: migrations
          image: fcg-identity-migrations:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_ENVIRONMENT
              value: Development
            - name: IDENTITY_MIGRATIONS_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: fcg-dev-secrets
                  key: identity-connection-string
            - name: Admin__Name
              value: Administrador Local
            - name: Admin__Email
              value: admin@fiapcloudgames.com
            - name: Admin__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-dev-secrets
                  key: identity-admin-password
            - name: InitialServiceClient__Secret
              valueFrom:
                secretKeyRef:
                  name: fcg-dev-secrets
                  key: web-bff-secret
            - name: InitialServiceClient__AllowedAudiences__0
              value: web-bff
            - name: InitialServiceClient__AllowedAudiences__1
              value: identity-api
            - name: InitialServiceClient__AllowedAudiences__2
              value: payments-api
            - name: InitialServiceClient__AllowedAudiences__3
              value: library-api
            - name: InitialServiceClient__AllowedScopes__0
              value: store.access
            - name: InitialServiceClient__AllowedScopes__1
              value: identity.users.create
            - name: InitialServiceClient__AllowedScopes__2
              value: identity.users.read
            - name: InitialServiceClient__AllowedScopes__3
              value: identity.users.write
            - name: InitialServiceClient__AllowedScopes__4
              value: identity.clients.create
            - name: InitialServiceClient__AllowedScopes__5
              value: identity.clients.read
            - name: InitialServiceClient__AllowedScopes__6
              value: identity.clients.write
            - name: InitialServiceClient__AllowedScopes__7
              value: identity.audit.read
            - name: InitialServiceClient__AllowedScopes__8
              value: payments.create
            - name: InitialServiceClient__AllowedScopes__9
              value: payments.read
            - name: InitialServiceClient__AllowedScopes__10
              value: payments.confirm
            - name: InitialServiceClient__AllowedScopes__11
              value: payments.cancel
            - name: InitialServiceClient__AllowedScopes__12
              value: library.games.read
            - name: InitialServiceClient__AllowedScopes__13
              value: library.ownership.read
